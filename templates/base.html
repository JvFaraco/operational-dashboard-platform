<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Operations Management Dashboard — analytics for service orders, scheduling and operational performance.">
  <title>{% block title %}Operations Dashboard{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">

</head>
